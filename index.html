    <style>
        /* --- CUSTOM CURSOR --- */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            white-space: nowrap;
            opacity: 0;
            will-change: transform, opacity;
            transition:
                opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .custom-cursor.is-visible {
            opacity: 1;
            transition:
                opacity 0.3s cubic-bezier(0.165, 0.84, 0.44, 1),
                transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* --- PAGE TRANSITIONS (CONTAINER) --- */
        .container {
            opacity: 0;
            transform: translateY(2em);
            will-change: opacity, transform;
            transition: opacity 0.5s ease, transform 0.5s ease;

            /* Anti-Flicker & GPU Acceleration */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-perspective: 1000px;
            perspective: 1000px;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
        }

        .container.transition-active {
            opacity: 1;
            transform: translateY(0);
        }

        .container.fade-out {
            opacity: 0 !important;
            transform: translateY(2em) !important;
            transition: opacity 0.5s ease, transform 0.5s ease !important;
        }

        /* --- REPRODUCTOR: GRÁFICOS --- */
        .music-graphic {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            width: max(1em, 16px);
            height: max(1.5em, 24px);
            gap: 2px;
        }

        .eq-bar {
            width: max(.25em, 4px);
            height: 0.1em;
            background-color: #808080;
            transition: background-color 0.3s ease, height 0.3s ease;
            border-radius: 1px;
            will-change: height;
        }

        .music-graphic.is-playing .eq-bar {
            background-color: #FE4C25;
        }

        .music-graphic.is-playing .eq-bar:nth-child(1) {
            animation: audio-freq 0.8s infinite ease-in-out;
        }

        .music-graphic.is-playing .eq-bar:nth-child(2) {
            animation: audio-freq 0.5s infinite ease-in-out 0.2s;
        }

        .music-graphic.is-playing .eq-bar:nth-child(3) {
            animation: audio-freq 0.7s infinite ease-in-out 0.4s;
        }

        @keyframes audio-freq {

            0%,
            100% {
                height: 20%;
            }

            50% {
                height: 100%;
            }
        }

        /* --- REPRODUCTOR: ICONOS --- */
        .icon-pause {
            display: none !important;
        }

        .icon-play {
            display: block !important;
        }

        .music-component.is-playing .icon-pause {
            display: block !important;
        }

        .music-component.is-playing .icon-play {
            display: none !important;
        }
    </style>

    <script>
        /**
         * 1. GLOBAL SCROLL RESET & PERFORMANCE FIXES
         */
        (function () {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            window.scrollTo(0, 0);
            window.addEventListener('load', () => window.scrollTo(0, 0));
        })();

        /**
         * 2. TÍTULO DINÁMICO (VISIBILITY CHANGE)
         */
        const originalTitle = document.title;
        document.addEventListener("visibilitychange", () => {
            document.title = document.hidden ? "Come back Bob :(" : originalTitle;
        });

        /**
         * 3. LÓGICA DE TRANSICIÓN DE PÁGINA (FADE IN/OUT) - ANTI-FLICKER
         */
        document.addEventListener("DOMContentLoaded", function () {
            const container = document.querySelector('.container');

            // --- ENTRADA (FADE IN) ---
            if (container) {
                // Si la página viene de caché (flechas), entramos más rápido para evitar parpadeo
                const entryDelay = (window.performance && window.performance.navigation.type === 2) ? 50 : 200;

                requestAnimationFrame(() => {
                    setTimeout(() => {
                        container.classList.add('transition-active');
                    }, entryDelay);
                });
            }

            // --- SALIDA (FADE OUT) ---
            document.addEventListener('click', function (e) {
                const target = e.target.closest('a');
                if (!target) return;

                const href = target.getAttribute('href');
                const isInternal = href &&
                    (href.startsWith('/') || href.includes(window.location.hostname)) &&
                    !href.includes('#') &&
                    target.target !== '_blank';

                if (isInternal && container) {
                    e.preventDefault();
                    const destination = target.href;

                    // Bloqueamos interacciones para evitar saltos visuales durante la salida
                    container.style.pointerEvents = 'none';
                    container.classList.remove('transition-active');
                    container.classList.add('fade-out');

                    setTimeout(() => {
                        window.location.href = destination;
                    }, 700);
                }
            });
        });

        // FIX BOTONES NAVEGADOR (PAGESHOW)
        window.addEventListener('pageshow', function (event) {
            const container = document.querySelector('.container');
            if (event.persisted && container) {
                container.classList.remove('fade-out');
                container.classList.add('transition-active');
                container.style.pointerEvents = 'auto';
            }
        });

        /**
         * 4. CUSTOM CURSOR (DESKTOP ONLY)
         */
        document.addEventListener("DOMContentLoaded", function () {
            if (window.innerWidth <= 991) return;

            const cursor = document.querySelector('.custom-cursor');
            const cursorText = document.querySelector('.cursor-text');
            if (!cursor) return;

            let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0;
            let isHovering = false;

            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animate() {
                cursorX += (mouseX - cursorX) * 0.1;
                cursorY += (mouseY - cursorY) * 0.1;

                const cursorRect = cursor.getBoundingClientRect();
                const offsetValue = 20;
                let xOffset = offsetValue;
                let yOffset = offsetValue;

                if (cursorX + cursorRect.width + offsetValue > window.innerWidth) {
                    xOffset = -(cursorRect.width + offsetValue);
                }

                const scale = isHovering ? 1 : 0.8;
                cursor.style.transform = `translate3d(${cursorX + xOffset}px, ${cursorY + yOffset}px, 0) scale(${scale})`;
                requestAnimationFrame(animate);
            }
            animate();

            document.addEventListener('mouseover', (e) => {
                const link = e.target.closest('[data-cursor]');
                if (link) {
                    isHovering = true;
                    if (cursorText) cursorText.textContent = link.getAttribute('data-cursor');
                    cursor.classList.add('is-visible');
                }
            });

            const hideCursor = (e) => {
                if (e.target.closest('[data-cursor]')) {
                    isHovering = false;
                    cursor.classList.remove('is-visible');
                }
            };
            document.addEventListener('mouseout', hideCursor);
            document.addEventListener('click', hideCursor);
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        /**
         * 1. TRANSICIONES Y ANTI-FLASH
         */
        document.addEventListener("DOMContentLoaded", function () {
            const container = document.querySelector('.container');
            if (container) {
                // Eliminamos el delay excesivo para que el contenido aparezca en cuanto el DOM esté listo
                requestAnimationFrame(() => {
                    container.classList.add('transition-active');
                });
            }

            document.addEventListener('click', function (e) {
                const target = e.target.closest('a');
                if (!target) return;
                const href = target.getAttribute('href');
                const isInternal = href && (href.startsWith('/') || href.includes(window.location.hostname)) && !href.includes('#') && target.target !== '_blank';

                if (isInternal && container) {
                    e.preventDefault();
                    container.style.pointerEvents = 'none';
                    container.classList.remove('transition-active');
                    container.classList.add('fade-out');
                    setTimeout(() => {window.location.href = target.href;}, 500); // Reducido a 500ms para mayor agilidad
                }
            });
        });

        /**
         * 2. REPRODUCTOR: PLAYLIST INFINITA Y AUTO-NEXT
         */
        const playlist = [
            {name: "Holy Forever", artist: "C. Tomlin & M. San Marcos", url: "https://raw.githubusercontent.com/uxdanydesign/songs/main/Chris%20Tomlin%20-%20Holy%20Forever%20(Español)%20%26%20Miel%20San%20Marcos%20(1).mp3"},
            {name: "Tumbas A Jadrines", artist: "B. Lake & E. Aguilar", url: "https://raw.githubusercontent.com/uxdanydesign/songs/main/Tumbas%20A%20Jardines%20(ft.%20Brandon%20Lake%20%26%20Edgar%20Aguilar)%20%20Maverick%20City%20Música.mp3"},
            {name: "Que Ruja El Leon", artist: "Marco Barrientos", url: "https://raw.githubusercontent.com/uxdanydesign/songs/main/Marco%20Barrientos%20-%20Que%20Ruja%20El%20León%20ft.%20Enoc%20Parra%20(Video%20Oficial).mp3"}
        ];

        let currentSongIndex = parseInt(localStorage.getItem('music_index')) || 0;
        let savedTime = parseFloat(localStorage.getItem('music_time')) || 0;
        const audio = new Audio(playlist[currentSongIndex].url);
        audio.currentTime = savedTime;
        audio.preload = "auto";

        const musicComponent = document.querySelector('.music-component');
        const graphicContainer = document.querySelector('.music-graphic');

        if (graphicContainer) {
            graphicContainer.innerHTML = '<span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>';
        }

        function updateVisuals() {
            const active = !audio.paused;
            if (musicComponent) musicComponent.classList.toggle('is-playing', active);
            if (graphicContainer) graphicContainer.classList.toggle('is-playing', active);
        }

        function updateMetadata(withFade = false) {
            const songNameEl = document.querySelector('.song-name');
            const artistNameEl = document.querySelector('.artist-name');
            if (songNameEl) songNameEl.innerText = playlist[currentSongIndex].name;
            if (artistNameEl) artistNameEl.innerText = playlist[currentSongIndex].artist;
        }

        // Función para cambiar de canción (Bucle Infinito)
        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            playSelectedSong();
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            playSelectedSong();
        }

        function playSelectedSong() {
            audio.pause();
            audio.src = playlist[currentSongIndex].url;
            audio.load();
            updateMetadata(true);
            audio.play().then(() => updateVisuals()).catch(() => updateVisuals());
        }

        // Evento: Cuando termina la canción, salta a la siguiente automáticamente
        audio.addEventListener('ended', () => {
            nextSong();
        });

        // Controles
        document.querySelector('.play-pause')?.addEventListener('click', (e) => {
            e.preventDefault();
            if (!audio.paused) audio.pause(); else audio.play();
            updateVisuals();
        });
        document.querySelector('.next-song')?.addEventListener('click', nextSong);
        document.querySelector('.previous-song')?.addEventListener('click', prevSong);

        audio.addEventListener('play', updateVisuals);
        audio.addEventListener('pause', updateVisuals);

        // Persistencia
        setInterval(() => {
            localStorage.setItem('music_time', audio.currentTime);
            localStorage.setItem('music_index', currentSongIndex);
            localStorage.setItem('music_playing', !audio.paused);
        }, 500);

        function syncAndResume() {
            const wasPlaying = localStorage.getItem('music_playing') === 'true';
            updateMetadata();
            if (wasPlaying && audio.paused) {
                audio.play().then(updateVisuals).catch(() => {
                    const resume = () => {audio.play(); window.removeEventListener('click', resume);};
                    window.addEventListener('click', resume);
                });
            }
            updateVisuals();
        }

        window.addEventListener('load', syncAndResume);
        window.addEventListener('pageshow', (e) => {if (e.persisted) syncAndResume();});
    </script>
    <script src="https://unpkg.com/lenis@1.1.2/dist/lenis.min.js"></script>
    <script>
        // 1. Inicialización de Lenis
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true,
            autoResize: true // Intenta recalcular automáticamente
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // 2. SOLUCIÓN AL BLOQUEO: Forzar recálculo cuando carguen las imágenes
        window.addEventListener('load', () => {
            lenis.resize();
        });

        // Detectar imágenes que cargan después (Lazy Load)
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('load', () => {
                lenis.resize();
            });
        });

        // 3. Control del Menú Personalizado (.btn-symbol)
        const menuBtn = document.querySelector('.btn-symbol');
        let isMenuOpen = false;

        if (menuBtn) {
            menuBtn.addEventListener('click', () => {
                isMenuOpen = !isMenuOpen;
                if (isMenuOpen) {
                    lenis.stop();
                    document.body.classList.add('no-scroll');
                } else {
                    lenis.start();
                    document.body.classList.remove('no-scroll');
                }
            });
        }
    </script>

    <style>
        /* CSS CRÍTICO para Lenis en Webflow */
        html {
            height: auto !important;
        }

        body.no-scroll {
            overflow: hidden !important;
            height: 100vh !important;
        }
    </style>




    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", function () {
            const loader = document.querySelector('.loader-wrapper');
            const mainContainer = document.querySelector('.container');
            if (!loader) return;

            const isHome = window.location.pathname === "/" || window.location.pathname === "/index.html" || window.location.pathname.endsWith('/');
            const isRefresh = performance.getEntriesByType("navigation")[0].type === "reload";
            const isFirstLoad = !sessionStorage.getItem('site-visited');

            if (isHome && (isFirstLoad || isRefresh)) {
                sessionStorage.setItem('site-visited', 'true');
                runLoader();
            } else {
                loader.style.display = 'none';
                if (mainContainer) mainContainer.classList.add('transition-active');
            }

            function runLoader() {
                // 1. Forzamos scroll al inicio e inmediatamente bloqueamos
                window.scrollTo(0, 0);
                document.body.classList.add('is-loading');

                const tl = gsap.timeline({
                    onComplete: () => {
                        // Al terminar la animación del stagger...
                        gsap.to(loader, {
                            opacity: 0,
                            duration: 0.8,
                            ease: "power2.inOut",
                            onStart: () => {
                                if (mainContainer) mainContainer.classList.add('transition-active');
                            },
                            onComplete: () => {
                                loader.style.display = 'none';

                                document.body.classList.remove('is-loading');
                            }
                        });
                    }
                });

                // 1. Entrada Stagger "Elastic Expo"
                tl.to(".loader-title", {
                    y: "0%",
                    delay: 0.3,
                    duration: 1.4,
                    ease: "expo.out",
                    stagger: 0.12
                });

                // 2. Apertura de espacio (Smooth Expand)
                tl.to(".loader-gif-outer", {
                    width: "auto",
                    duration: 1,
                    ease: "expo.inOut"
                }, "-=0.8");

                // 3. GIF Fade In
                tl.to(".loader-gif-inner", {
                    opacity: 1,
                    scale: 1,
                    duration: 0.8,
                    ease: "expo.out"
                }, "-=0.6");

                // 4. Pausa de lectura
                tl.to({}, {duration: 1.2});

                // 5. Salida "Accelerated In" (Caída suave)
                tl.to(".loader-title:first-child", {
                    y: "115%",
                    duration: 0.7,
                    ease: "expo.in"
                });

                tl.to(".loader-gif-inner", {
                    y: "115%",
                    opacity: 0,
                    duration: 0.7,
                    ease: "expo.in"
                }, "-=0.7");

                tl.to(".loader-title:last-child", {
                    y: "115%",
                    duration: 0.7,
                    ease: "expo.in"
                }, "-=0.7");
            }
        });
    </script>
