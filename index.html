    <script>

        /* ==========================================================================
           FRASES DEL LOADER
           Para agregar o quitar una frase, solo agrega o borra una línea de texto aquí.
           Cada vez que se muestra el loader sale una al azar (sin repetir la anterior).
           ========================================================================== */
        const LOADER_PHRASES = [
            'it dont matter if you win by an inch or a mile, winning is winning',
        ];

        document.addEventListener("DOMContentLoaded", function () {
            const loader = document.querySelector('.loader-wrapper');
            const mainContainer = document.querySelector('.container');
            if (!loader) return;

            const isHome = window.location.pathname === "/" || window.location.pathname === "/index.html" || window.location.pathname.endsWith('/');
            const isRefresh = performance.getEntriesByType("navigation")[0].type === "reload";
            const isFirstLoad = !sessionStorage.getItem('site-visited');

            if (isHome && (isFirstLoad || isRefresh)) {
                sessionStorage.setItem('site-visited', 'true');
                runLoader();
            } else {
                loader.style.display = 'none';
                if (mainContainer) mainContainer.classList.add('transition-active');
            }

            // Elige una frase al azar, evitando repetir la última que salió
            function pickPhrase() {
                const list = LOADER_PHRASES;
                let i = Math.floor(Math.random() * list.length);
                try {
                    const last = parseInt(localStorage.getItem('loader_phrase'));
                    if (list.length > 1 && i === last) i = (i + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;
                    localStorage.setItem('loader_phrase', i);
                } catch (e) { }
                return list[i];
            }

            function runLoader() {
                // 1. Forzamos scroll al inicio e inmediatamente bloqueamos
                window.scrollTo(0, 0);
                document.body.classList.add('is-loading');

                // 2. Armamos la frase: una <span> por palabra
                const phraseEl = loader.querySelector('.loader-phrase');
                phraseEl.textContent = '';
                const words = pickPhrase().trim().split(/\s+/).map((w, k, arr) => {
                    const s = document.createElement('span');
                    s.className = 'loader-word';
                    s.textContent = w;
                    phraseEl.appendChild(s);
                    if (k < arr.length - 1) phraseEl.appendChild(document.createTextNode(' '));
                    return s;
                });

                // Blur proporcional a la escala del sitio (.8em)
                const blur = (parseFloat(getComputedStyle(document.body).fontSize) || 14) * 0.8;
                gsap.set(words, { opacity: 0, filter: `blur(${blur}px)` });

                const tl = gsap.timeline({
                    onComplete: () => {
                        // Al terminar, fade del fondo del loader (sin blur: ya no hay texto, es más ligero)
                        gsap.to(loader, {
                            opacity: 0,
                            duration: 1,
                            ease: "ease out",
                            onStart: () => {
                                if (mainContainer) mainContainer.classList.add('transition-active');
                            },
                            onComplete: () => {
                                loader.style.display = 'none';

                                document.body.classList.remove('is-loading');
                            }
                        });
                    }
                });

                // 1. Entrada: stagger por palabra con blur -> nítido
                tl.to(words, {
                    opacity: 1,
                    filter: "blur(0px)",
                    delay: 0.3,
                    duration: 1,
                    ease: "expo.out",
                    stagger: 0.12
                });

                // 2. Pausa de lectura. Aquí se libera el blur por palabra y se pasa a un solo blur
                //    sobre toda la frase para la salida (1 capa en vez de una por palabra)
                tl.to({}, { duration: 1.2 });
                tl.add(() => {
                    gsap.set(words, { filter: "none", willChange: "auto" });
                    gsap.set(phraseEl, { filter: "blur(0px)", willChange: "filter, opacity" });
                });

                // 3. Salida: fade + blur de toda la frase
                tl.to(phraseEl, {
                    opacity: 0,
                    filter: `blur(${blur}px)`,
                    duration: 1,
                    ease: "expo.in"
                });
            }
        });
    </script>
