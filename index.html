    <script>

        document.addEventListener("DOMContentLoaded", function () {
            const loader = document.querySelector('.loader-wrapper');
            const mainContainer = document.querySelector('.container');
            if (!loader) return;

            const isHome = window.location.pathname === "/" || window.location.pathname === "/index.html" || window.location.pathname.endsWith('/');
            const isRefresh = performance.getEntriesByType("navigation")[0].type === "reload";
            const isFirstLoad = !sessionStorage.getItem('site-visited');

            if (isHome && (isFirstLoad || isRefresh)) {
                sessionStorage.setItem('site-visited', 'true');
                runLoader();
            } else {
                loader.style.display = 'none';
                if (mainContainer) mainContainer.classList.add('transition-active');
            }

            function runLoader() {
                // 1. Forzamos scroll al inicio e inmediatamente bloqueamos
                window.scrollTo(0, 0);
                document.body.classList.add('is-loading');

                const tl = gsap.timeline({
                    onComplete: () => {
                        // Al terminar la animación del stagger...
                        gsap.to(loader, {
                            opacity: 0,
                            duration: 0.8,
                            ease: "power2.inOut",
                            onStart: () => {
                                if (mainContainer) mainContainer.classList.add('transition-active');
                            },
                            onComplete: () => {
                                loader.style.display = 'none';

                                document.body.classList.remove('is-loading');
                            }
                        });
                    }
                });

                // 1. Entrada Stagger "Elastic Expo"
                tl.to(".loader-title", {
                    y: "0%",
                    delay: 0.3,
                    duration: 1.4,
                    ease: "expo.out",
                    stagger: 0.12
                });

                // 2. Apertura de espacio (Smooth Expand)
                tl.to(".loader-gif-outer", {
                    width: "auto",
                    duration: 1,
                    ease: "expo.inOut"
                }, "-=0.8");

                // 3. GIF Fade In
                tl.to(".loader-gif-inner", {
                    opacity: 1,
                    scale: 1,
                    duration: 0.8,
                    ease: "expo.out"
                }, "-=0.6");

                // 4. Pausa de lectura
                tl.to({}, { duration: 1.2 });

                // 5. Salida "Accelerated In" (Caída suave)
                tl.to(".loader-title:first-child", {
                    y: "115%",
                    duration: 0.7,
                    ease: "expo.in"
                });

                tl.to(".loader-gif-inner", {
                    y: "115%",
                    opacity: 0,
                    duration: 0.7,
                    ease: "expo.in"
                }, "-=0.7");

                tl.to(".loader-title:last-child", {
                    y: "115%",
                    duration: 0.7,
                    ease: "expo.in"
                }, "-=0.7");
            }
        });
    </script>
